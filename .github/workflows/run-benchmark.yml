name: Run DILI generalization benchmark

on:
  push:
    branches: [main]
    paths:
      - benchmark_generalization.py
      - requirements.txt
      - .github/workflows/run-benchmark.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmark
        run: python benchmark_generalization.py --output-dir results

      - name: Commit benchmark outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Update DILI generalization benchmark results [skip ci]"
          git pull --rebase origin main
          git push origin main
